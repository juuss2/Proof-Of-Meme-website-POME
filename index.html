<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$POME – Proof of Meme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .logo {
      font-size: 4.2rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 1.35rem;
      color: #aaaaaa;
      margin-bottom: 28px;
      font-weight: 500;
    }

    .description {
      font-size: 1.1rem;
      color: #cccccc;
      margin-bottom: 36px;
    }

    .tokenomics {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 36px;
      text-align: left;
    }

    .tokenomics-title {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .token-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #222;
    }

    .token-row:last-child {
      border-bottom: none;
    }

    .token-label {
      color: #aaa;
      font-size: 0.95rem;
    }

    .token-value {
      font-weight: 600;
      font-size: 1.05rem;
      color: #00ff88;
    }

    .links {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-x {
      background: #1a1a1a;
      color: #ffffff;
      border: 1px solid #333;
    }

    .btn-tg {
      background: #0088cc;
      color: #ffffff;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">$POME</div>
    <div class="tagline">Proof of Meme</div>
    
    <p class="description">
      Crypto needs memes.<br>
      Man needs memes.<br>
      Arc needs $POME.
    </p>

    <div class="tokenomics">
      <div class="tokenomics-title">Tokenomics</div>
      <div class="token-row">
        <span class="token-label">Supply</span>
        <span class="token-value">500,000,000</span>
      </div>
      <div class="token-row">
        <span class="token-label">Circulating</span>
        <span class="token-value">100%</span>
      </div>
    </div>

    <div class="links">
      <a href="https://x.com" class="btn btn-x" target="_blank">Follow on X</a>
      <a href="https://t.me" class="btn btn-tg" target="_blank">Join Telegram</a>
    </div>

    <div class="footer">
      Built on GitHub Pages
    </div>
  </div>
</body>
</html>
